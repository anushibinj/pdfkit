[package]
name = "pdf-ocr"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "OCR PDF helper WebAssembly module: gzip decompression, DPI-aware BMP preprocessing, glyphless TrueType + ToUnicode CMap text layer construction, and overlay MediaBox normalization. Compiled to WebAssembly for pdfkit."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The PDF object model (parse, edit, save). Default features pull in a clock
# and a thread pool, neither of which exists in a browser worker.
lopdf = { version = "=0.47.0", default-features = false }
# Gzip decompression for self-hosted `.traineddata.gz` and Flate stream compression.
flate2 = "1"
# lopdf depends on getrandom (for encrypting, which this crate never does).
# The crate registers a custom backend that always fails; see `src/ffi.rs`.
getrandom = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
